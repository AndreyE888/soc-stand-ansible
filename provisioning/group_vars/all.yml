# IP-адреса VM (Host-Only, 192.168.57.0/24)
docker_ip: 192.168.57.10
registry_ip: 192.168.57.11
storage_ip: 192.168.57.12

# Docker Registry
registry_host: docker-registry
registry_port: 5000

# Сертификаты Registry
registry_certs_dir: /home/vagrant/certs
registry_cert: "{{ registry_certs_dir }}/domain.crt"
registry_key: "{{ registry_certs_dir }}/domain.key"
registry_ca_on_client: "/etc/docker/certs.d/{{ registry_host }}:{{ registry_port }}/ca.crt"

# Cosign
cosign_version: v3.1.3
cosign_key_password: "vagrant"

# OPA
opa_authz_plugin: "openpolicyagent/opa-docker-authz-v2:0.4"
opa_plugin_alias: "opa-authz"

# Falco
falco_log_dir: /var/log/falco
falco_log_file: "{{ falco_log_dir }}/events.log"

# Rsyslog
rsyslog_port: 514
rsyslog_remote_dir: /var/log/remote
