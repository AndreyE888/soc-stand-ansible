- name: Установить зависимости для Falco
  ansible.builtin.apt:
    name:
      - curl
      - gpg
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: true

- name: Скачать ключ Falco
  ansible.builtin.shell: |
    curl -fsSL https://falco.org/repo/falcosecurity-packages.asc | \
    gpg --dearmor -o /usr/share/keyrings/falco-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/falco-archive-keyring.gpg

- name: Добавить репозиторий Falco
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/falco.sources
    content: |
      Types: deb
      URIs: https://download.falco.org/packages/deb
      Suites: stable
      Components: main
      Signed-By: /usr/share/keyrings/falco-archive-keyring.gpg
    mode: '0644'

- name: Обновить apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Установить Falco
  ansible.builtin.apt:
    name: falco
    state: present

- name: Создать папку для доп. конфигов falco
  ansible.builtin.file:
    path: /etc/falco/config.d
    state: directory
    mode: '0755'

- name: Создать доп. конфиг для записи логов falco в файл
  ansible.builtin.copy:
    dest: /etc/falco/config.d/99-file-output.yaml
    content: |
      file_output:
        enabled: true
        keep_alive: false
        filename: /var/log/falco/events.log
    mode: '0644'
  notify: Restart falco

- name: Создать директорию для логов falco
  ansible.builtin.file:
    path: /var/log/falco
    state: directory
    mode: '0755'

- name: Разрешить чтение логов Falco для rsyslog
  ansible.builtin.file:
    path: /var/log/falco/events.log
    mode: '0644'
    state: touch

- name: Установить rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present

- name: Настроить rsyslog на чтение логов Falco (50-falco.conf)
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/50-falco.conf
    content: |
      module(load="imfile")
      input(type="imfile" File="/var/log/falco/events.log" Tag="falco:" Facility="local0")
      local0.* action(type="omfwd" target="192.168.57.12" port="514" protocol="tcp")
    mode: '0644'
  notify: Restart rsyslog

- name: Убедиться, что rsyslog запущен и включен
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
    enabled: true
